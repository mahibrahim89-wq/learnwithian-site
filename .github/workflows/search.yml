name: Search Doctor (weekly)

# Reads Google Search Console once a week: report, better titles for pages that are seen
# but not clicked, and new topics from real searches. Off switch: data/PAUSE_DOCTOR.
on:
  schedule:
    - cron: "13 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: site-writes
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Google without a key (only this site's main branch is allowed)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/569369785612/locations/global/workloadIdentityPools/github/providers/learnwithian-site
          service_account: search-doctor@learnwithian-search.iam.gserviceaccount.com
      - name: Install the Google helper
        run: pip install -q google-auth requests
      - name: Read Search Console and improve the site (never stops the site)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/search_doctor.py
      - name: Rebuild the activity pages
        run: python3 scripts/pages.py || true
      - name: The Weaver links the pages into the site
        run: python3 scripts/weave.py || true
      - name: Save changes
        run: |
          git config user.name "learnwithian-bot"
          git config user.email "hello@learnwithian.com"
          git add -A ':!gha-creds-*.json'
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Search Doctor weekly update"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 20; done
          fi
