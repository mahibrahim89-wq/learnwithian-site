name: Daily site update

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add new store links to the first episodes
        run: python3 scripts/shop_merge.py
      - name: Read the YouTube channel and rebuild the pages
        run: python3 scripts/update.py
      - name: Build the search pages (one page per episode, sitemap, robots.txt)
        run: python3 scripts/seo_pages.py
      - name: Free printables, topic, teachers and Spanish/Portuguese pages
        run: python3 scripts/extras.py
      - name: Point episode clicks to the episode pages
        run: python3 scripts/link_pages.py
      - name: Free printable games (from Drive) and the Pinterest feed
        run: python3 scripts/activities.py
      - name: Daily Pinterest feeds (a few new Pins every day)
        run: python3 scripts/pins.py
      - name: Worksheet pictures on the site, picture descriptions and llms.txt
        run: python3 scripts/media_seo.py
      - name: Tell Bing about new pages (IndexNow)
        run: python3 scripts/indexnow.py
      - name: Save changes
        run: |
          git config user.name "learnwithian-bot"
          git config user.email "hello@learnwithian.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new on the channel."
          else
            git commit -m "Site update from YouTube"
            git push
          fi
